name: PR Validation

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  # ── 1. Build & Type Check ────────────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID:   ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          COACH_TOKEN_SECRET:            ${{ secrets.COACH_TOKEN_SECRET }}

  # ── 2. API Smoke Tests (Karate) ──────────────────────────────────────────────
  api-smoke:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      app:
        image: node:20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install app dependencies
        run: npm ci

      - name: Start Next.js dev server
        run: npm run dev &
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID:   ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET:           ${{ secrets.RAZORPAY_KEY_SECRET }}
          ADMIN_PASSWORD:                ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}
          COACH_TOKEN_SECRET:            ${{ secrets.COACH_TOKEN_SECRET }}

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Karate API smoke tests
        working-directory: tests/automation/karate
        run: mvn test -Dkarate.env=local -Dtest=SmokeRunner -pl .
        env:
          BASE_URL:       http://localhost:3000
          TEST_EMAIL:     ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD:  ${{ secrets.TEST_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET:    ${{ secrets.CRON_SECRET }}

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-smoke-report
          path: tests/automation/karate/target/karate-reports/

  # ── 3. Playwright UI Smoke Tests ─────────────────────────────────────────────
  ui-smoke:
    name: UI Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install app + test dependencies
        run: |
          npm ci
          cd tests/automation/playwright && npm ci

      - name: Install Playwright browsers
        working-directory: tests/automation/playwright
        run: npx playwright install --with-deps chromium

      - name: Start Next.js dev server
        run: npm run dev &
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID:   ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET:           ${{ secrets.RAZORPAY_KEY_SECRET }}
          ADMIN_PASSWORD:                ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}
          COACH_TOKEN_SECRET:            ${{ secrets.COACH_TOKEN_SECRET }}

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright smoke tests
        working-directory: tests/automation/playwright
        run: npx playwright test --project chromium --grep "@smoke" --reporter=html
        env:
          BASE_URL:                  http://localhost:3000
          TEST_EMAIL:                ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD:             ${{ secrets.TEST_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ADMIN_PASSWORD:            ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET:               ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: tests/automation/playwright/reports/

  # ── 4. Security Suite ────────────────────────────────────────────────────────
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm run dev &
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_KEY_SECRET:           ${{ secrets.RAZORPAY_KEY_SECRET }}
          ADMIN_PASSWORD:                ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET:                   ${{ secrets.CRON_SECRET }}
          COACH_TOKEN_SECRET:            ${{ secrets.COACH_TOKEN_SECRET }}

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Karate security tests
        working-directory: tests/automation/karate
        run: mvn test -Dkarate.env=local -Dtest=SecurityRunner -pl .
        env:
          BASE_URL:       http://localhost:3000
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET:    ${{ secrets.CRON_SECRET }}

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-report
          path: tests/automation/karate/target/karate-reports/

  # ── 5. Deployment Gate ───────────────────────────────────────────────────────
  deployment-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [build, api-smoke, ui-smoke, security]
    if: ${{ success() }}
    steps:
      - name: All checks passed — deployment approved
        run: echo "✅ All smoke, security and build checks passed. Safe to deploy."

body{width:390px;height:844px;overflow:hidden;background:#0a0a0a;color:#e5e5e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.bar{background:rgba(10,10,10,0.92);padding:52px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between}

.bar-title{font-size:16px;font-weight:800;color:#fff}
.bar-ph{width:24px}
.scroll{padding:16px;overflow:hidden}
.session-hero{background:linear-gradient(135deg,#1a0d00,#0f0700);border:1px solid rgba(232,98,10,0.2);border-radius:20px;padding:20px;margin-bottom:16px}
.hero-label{font-size:10px;color:#e8620a;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.hero-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.meta-chip{background:rgba(255,255,255,0.06);border-radius:8px;padding:5px 10px;font-size:11px;color:#888;display:flex;align-items:center;gap:5px}
.meta-chip svg{color:#e8620a}
.attendance-row{display:flex;align-items:center;gap:10px}
.att-avatars{display:flex}
.att-av{width:26px;height:26px;border-radius:50%;border:2px solid #1a0d00;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;margin-right:-8px}
.att-count{font-size:12px;color:#888;margin-left:14px}
.att-count strong{color:#e8620a}
.qr-section{background:#111;border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.qr-label{font-size:12px;color:#888;text-align:center;line-height:1.4}
.qr-box{width:170px;height:170px;background:#fff;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:center;position:relative}
.qr-inner{width:100%;height:100%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:1px}
.q{background:#000;border-radius:1px}
.q0{background:transparent}
.qr-corner{position:absolute;width:40px;height:40px;border:4px solid #000;border-radius:6px}
.qr-c1{top:12px;left:12px}
.qr-c2{top:12px;right:12px}
.qr-c3{bottom:12px;left:12px}
.qr-c-inner{position:absolute;width:20px;height:20px;background:#000;border-radius:2px;top:50%;left:50%;transform:translate(-50%,-50%)}
.scan-btn{width:100%;background:#e8620a;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.pts-note{font-size:12px;color:#555;text-align:center}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:rgba(10,10,10,0.95);border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:flex-start;justify-content:space-around;padding:10px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;padding-top:4px}
.nav-lbl{font-size:9px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:0.06em}

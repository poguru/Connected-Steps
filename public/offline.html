<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>No Connection — Connected Steps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --surface: #111111;
      --border:  rgba(255,255,255,0.08);
      --orange:  #e8620a;
      --muted:   #555;
      --text:    #e5e5e5;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
      text-align: center;
      gap: 0;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin-bottom: 32px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { display: block; }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.65;
      max-width: 280px;
      margin: 0 auto 36px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(232,98,10,0.35);
      transition: opacity 0.15s;
    }

    button:active { opacity: 0.8; }

    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 40px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
      40%            { opacity: 1;   transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="shell">

    <!-- App logo -->
    <div class="logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <path d="M8 26 C8 26 12 14 18 14 C24 14 28 26 28 26" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="18" cy="10" r="4" fill="white"/>
        <path d="M6 30 L30 30" stroke="white" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- No-wifi icon -->
    <div class="icon-wrap" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e8620a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="#e8620a" stroke="none"/>
      </svg>
    </div>

    <h1>No Connection</h1>
    <p>Connected Steps needs an internet connection to load. Check your Wi-Fi or mobile data, then try again.</p>

    <button onclick="retry()" id="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
      </svg>
      Try again
    </button>

    <div class="dots" aria-hidden="true">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <script>
    function retry() {
      var btn = document.getElementById("btn");
      btn.textContent = "Checking…";
      btn.disabled = true;
      // Small delay so the user sees feedback, then reload
      setTimeout(function() { window.location.reload(); }, 600);
    }

    // Auto-retry when connection is restored
    window.addEventListener("online", function() {
      window.location.reload();
    });
  </script>
</body>
</html>

<svg viewBox="0 0 2560 2560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- White background for logo -->
  <rect width="2560" height="2560" fill="white"/>

  <!-- Runners silhouettes -->
  <g transform="translate(300, 900)">
    <!-- Runner 1 (female) -->
    <circle cx="150" cy="150" r="120" fill="black"/>
    <ellipse cx="150" cy="350" rx="100" ry="200" fill="black"/>
    <rect x="80" y="550" width="70" height="300" fill="black"/>
    <rect x="190" y="550" width="70" height="300" fill="black"/>
    <rect x="50" y="300" width="60" height="250" fill="black" transform="rotate(-35 80 300)"/>
    <rect x="220" y="300" width="60" height="250" fill="black" transform="rotate(45 250 300)"/>
  </g>

  <!-- Runner 2 (male) -->
  <g transform="translate(500, 850)">
    <circle cx="150" cy="150" r="130" fill="black"/>
    <ellipse cx="150" cy="380" rx="110" ry="220" fill="black"/>
    <rect x="70" y="600" width="80" height="320" fill="black"/>
    <rect x="200" y="600" width="80" height="320" fill="black"/>
    <rect x="30" y="280" width="70" height="280" fill="black" transform="rotate(-40 65 280)"/>
    <rect x="230" y="280" width="70" height="280" fill="black" transform="rotate(50 265 280)"/>
  </g>

  <!-- Building (Charminar-inspired) -->
  <g transform="translate(1000, 500)">
    <!-- Main structure -->
    <rect x="200" y="600" width="600" height="600" fill="black"/>

    <!-- Four minarets -->
    <g>
      <rect x="150" y="250" width="120" height="750" fill="black"/>
      <circle cx="210" cy="200" r="80" fill="black"/>
      <circle cx="210" cy="150" r="60" fill="black"/>
    </g>

    <g>
      <rect x="850" y="250" width="120" height="750" fill="black"/>
      <circle cx="910" cy="200" r="80" fill="black"/>
      <circle cx="910" cy="150" r="60" fill="black"/>
    </g>

    <g>
      <rect x="350" y="50" width="100" height="900" fill="black"/>
      <circle cx="400" cy="0" r="70" fill="black"/>
    </g>

    <g>
      <rect x="750" y="50" width="100" height="900" fill="black"/>
      <circle cx="800" cy="0" r="70" fill="black"/>
    </g>

    <!-- Main arch entrance -->
    <path d="M 400 600 Q 500 400 600 600" stroke="black" stroke-width="40" fill="none"/>
  </g>

  <!-- Curved line -->
  <path d="M 1200 1500 Q 1400 1400 1600 1500" stroke="black" stroke-width="60" fill="none" stroke-linecap="round"/>

  <!-- Text -->
  <g font-family="Arial, sans-serif" font-weight="bold" fill="black">
    <text x="700" y="2000" font-size="280" font-weight="900" letter-spacing="20">THE</text>
    <text x="400" y="2280" font-size="420" font-weight="900" letter-spacing="40">ITRUN</text>
    <text x="1500" y="2220" font-size="180" font-weight="700" letter-spacing="15">SPIRIT - 2</text>
  </g>
</svg>
